name = "picard3-beatport-id-auto-tagger"
description = "Panel lateral para asignar BEATPORT_TRACK_ID y BEATPORT_RELEASE_ID a las pistas seleccionadas."
long_description = """
Añade un panel acoplable a la ventana principal de Picard para escribir manualmente
las etiquetas **BEATPORT_TRACK_ID** y **BEATPORT_RELEASE_ID** en uno o varios archivos.

- Funciona con archivos, pistas, álbumes y clústeres seleccionados.
- Solo admite IDs numéricos.
- El panel puede volver a mostrarse desde *Herramientas → Plugins → picard3-beatport-id-auto-tagger*.
"""
